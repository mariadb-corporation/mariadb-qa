MDG_START_TIMEOUT=200                                          # Should not be necessary to change. Default: 200
MDG_ADD_RANDOM_OPTIONS=0                                       # Set to 1 to add random MDG mysqld options
MDG_MAX_NR_OF_RND_OPTS_TO_ADD=4                                # Max nr of random MDG mysqld options to add (minimum is always 1). Recommended: 4
