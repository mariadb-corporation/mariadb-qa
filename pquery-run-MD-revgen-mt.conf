MDG_CLUSTER_RUN=0                                              # Set to 1 to make this a mdg pquery cluster run (enables multi-node SQL instead of using a single node only)
ENCRYPTION_RUN=0                                               # Set to 1 ro make this a MariaDB Galera encryption enabled run
NR_OF_NODES=2                                                  # Nr of MDG nodes 1-n
MDG_CLUSTER_CONFIG=${SCRIPT_PWD}/pquery/pquery-cluster.cfg     # Default pquery cluster configuration file.
