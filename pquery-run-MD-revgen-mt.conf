# Welcome to the pquery-run.sh configuration file (pquery-run.conf). Feel free to copy this file, edit the copy & change the CONFIGURATION_FILE variable in pquery-run.sh to match!
# Please do not change this file unless your name is listed above. As a template/default, it is the only configuration file which is maintained whenever pquery-run.sh is updated.

# Multi-threaded revgen variant of pquery-run-MD-revgen.conf. Seven client threads
# and --allow-locking, which puts LOCK TABLES, BACKUP LOCK and XA back into the
# generated SQL. Those are left out of the single-threaded config because one
# session holding a lock only blocks itself; with several sessions there is real
# contention, and that is where the locking and transaction code has bugs to
# find. Everything else matches the single-threaded config.

# ========================================= User configurable variables: generics 1 ===============================================
ELIMINATE_KNOWN_BUGS=1                                               # New option to auto-delete known issues (avoids the need for pquery-go-expert.sh etc. to do cleanups).
PQUERY_BIN=${SCRIPT_PWD}/pquery/pquery2-md.NEW                          # pquery2-md: MariaDB, pquery2-ps: Percona Server, pquery2-ms: MySQL, pquery2-ws: WS/FB: WSS/fb-mysql
# ================================ SQL INPUT: the sources and the per-trial SQL ================================
# -- source: the SQL generator --
USE_GENERATOR=0                                                      # Use generated SQL from the C++ generator (mariadb-qa/generatorcpp/). It runs once per trial. No framework shuffling is needed as generatorcpp uses a much improved random setup (xoshiro256++ entropy)
QUERIES_PER_GENERATOR_RUN=50000                                      # Queries the generator writes per trial. This is also its share of the SQL: the mix between the sources is simply their line counts
GENERATORCPP_OPTIONS=""                                              # Passed verbatim to generatorcpp. Example: --weights /path/to/feature.weights
# -- source: revgen --
USE_REVGEN=1                                                         # Use SQL from revgen (mariadb-qa/revgen/), which walks the server yacc grammar (REVGEN_YACC). It runs once per trial
QUERIES_PER_REVGEN_RUN=200000                                        # Queries revgen writes per trial, and its share of the SQL, the same way
REVGEN_OPTIONS="--depth 9 --allow-locking"                           # Passed verbatim to revgen. Example: --depth 12
REVGEN_YACC=${SCRIPT_PWD}/yacc/13.1_sql_yacc.yy                      # The yacc grammar revgen walks. pquery-run aborts at start if this file is missing
# -- source: an SQL input file --
USE_INFILE=0                                                         # Use the SQL input file below
QUERIES_PER_INFILE=50000                                             # Lines randomly selected from the input file per trial (xoshiro256++ entropy), and the share of this source. 0: use the whole file; a file larger than PQUERY_MAX_SQL_LINES is then read from a random offset each trial
INFILE=/data/SQL/mtrtosql_05-02-26.sql                              # The fixed SQL file source, used when USE_INFILE=1
#INFILE=${HOME}/newgen_sql_v4.sql                                  # Default: main-ms-ps-md.sql (mtr_to_sql.sh of all major distro's + engine mix). Use main-ws.sql for mysql-fb
#INFILE=${SCRIPT_PWD}/pquery/main-ms-ps-md-NEW.sql
#INFILE=${SCRIPT_PWD}/pquery/main-ms-ps-md.sql.tar.xz 
# -- source: all SQL on the disk --
USE_ALL_DISK_SQL=0                                                   # Use SQL sampled from every *.sql file on the disk. The file list is indexed once per run
QUERIES_PER_ALL_DISK_RUN=100000                                      # Lines to collect from the disk index, and the share of this source. Fewer are collected when the disk holds less SQL than this
ALL_DISK_SQL_NEW_QUERIES_EVERY_X_TRIALS=4                            # Collect a new all-disk pool every x trials. Collecting is the one slow source, so it is not done per trial
# -- generation --
GENERATION_THREADS=0                                                 # Threads for the generator and revgen. 0 = auto (CPU cores / 4). They run while no server is up, so more threads is safe
# -- the per-trial SQL --
PQUERY_MAX_SQL_LINES=5141189                                         # Cap on the per-trial SQL. 5141189 is the pquery line maximum. The cut takes lines from the end, and the sources are joined in the order generator, revgen, INFILE, all-disk, so the last source in use loses lines first
TRIAL_SQL_DIR="/dev/shm/trial_sql"                                   # Where the assembled per-trial SQL is written. tmpfs is the right place for it
ADV_FILTER_SQL=1                                                     # Remove any SQL line matching ADV_FILTER_LIST (set in pquery-run.sh) from the per-trial SQL. Keep this off for a purpose-built input file, whose queries it would remove
# -- SQL transforms, applied to the per-trial SQL --
INTERLEAVE=1                                                         # Insert INTERLEAVE_SQL into the per-trial SQL every INTERLEAVE_LINES lines
INTERLEAVE_SQL="CREATE TABLE t1 (c1 INT PRIMARY KEY) ENGINE=InnoDB"  # One or more lines to interleave into the per-trial SQL, every INTERLEAVE_LINES lines. Use \n between statements
INTERLEAVE_LINES=4000                                                # Interleave the SQL in INTERLEAVE_SQL every this many lines
STORAGE_ENGINE_SWAP=""                                               # When set, storage engine names in the per-trial SQL are changed to this one
STORAGE_ENGINE_SWAP_PERCENTAGE=50                                    # Percent (1-100) of the per-trial SQL lines in which STORAGE_ENGINE_SWAP swaps engines. The swapped lines are spread evenly over the whole file
SWAP_ALL_TABLE_NAMES_TO_T1=0                                         # Swap all table names to t1, in every statement of the per-trial SQL
SWAP_CREATE_TABLE_NAMES_TO_T1=0                                      # Swap the table name of every CREATE TABLE in the per-trial SQL to t1
REVGEN_VALIDATE_SOCKET=                                             # Optional. Socket of a separate, expendable server that revgen PREPARE-tests its output against, dropping statements the server cannot parse. The trial server does not exist yet at generation time, and PREPARE of generated SQL reaches crashing code paths, so do not point this at anything whose death matters. Unset = off
OPTIONS_INFILE=${SCRIPT_PWD}/pquery/mysqld_options_mariadb_11.2_no_ps.txt  # Set to the right distribution + version to match mysqld options (as generated by generate_mysqld_options.sh)
                                                                     # mysqld_options_ps_56.txt, mysqld_options_ms_56.txt, mysqld_options_ms_57.txt, mysqld_options_ps_55.txt etc.
FILTER_SQL=1                                                         # Set 1 to remove any SQL line matching a line in filter.sql from the per-trial SQL, in one pass over all the sources together
RR_TRACING=0                                                         # Enable rr tracing (requires specific server setup)
TOKUDB_OPTIONS_INFILE=                                               # TokuDB options list
BASEDIR=/test/MD220726-mariadb-13.1.0-linux-x86_64-dbg   # MySQL Basedir. Required for all runs, including PXC 
WORKDIR=/data/$RANDOMD                                               # Working directory. Here we keep the log files, option list, failed items. Please leave $RANDOMD!
RUNDIR=/dev/shm/$RANDOMD                                             # Run directory. Keeps a copy of the data dir template & stores mysqld runs (--datadir=x). Pls leave $RANDOMD!
SYSBENCH_DATALOAD=0                                                  # Sysbench data load. Normally set to 0 (off)
TIMEOUT_INCREMENT=0                                                  # Increase the PQUERY_RUN_TIMEOUT by this many seconds each time no problem was discovered. Default (best): 0, settings >1 are not recommended                                                  # Add x (0 or more) seconds to the trial timeout if the timeout was reached (if QUERIES_PER_THREAD is reached first, this will not take effect so ensure it is sufficiently large)

# ========================================= User configurable variables: generics 2 ===============================================
TRIALS=100000                                                  # Number of individual trials to execute (one can always interrupt with ctrl+c also)
# RV 28/3 - disabled ftm, too many bugs and too much OOM's as a result of runs/reducers combinatorics. Setup once major batches of bugs are logged and auto-filtered
ADD_RANDOM_OPTIONS=0                                           # Add random mysqld --options to MYEXTRA using an input file. 1=On, 0=off. (Auto-disabled if PXC=1)
ADD_RANDOM_TOKUDB_OPTIONS=0                                    # Add random tokudb --options to MYEXTRA using an input file. 1=On, 0=off. (Auto-disabled if PXC=1)
MAX_NR_OF_RND_OPTS_TO_ADD=4                                    # Max nr of random options to add (minimum is always 1). Recommended: 4. Counts per ADD_RANDOM_... option above (x2)
SAVE_TRIALS_WITH_BUGS_ONLY=1                                   # Save only trials that generate a bug-like outcome (i.e. any new_text_string.sh or fallback_text_string.sh output)
SAVE_SQL=0                                                     # Saves per-trial SQL even if SAVE_TRIALS_WITH_BUGS_ONLY=1. Main usecase: full server lockups/hangs
STORE_COPY_OF_INFILE=0                                         # Store a copy of the INFILE SQL input file in the work directory (not related to per-trial SQL)
PQUERY_RUN_TIMEOUT=11                                          # x sec max trial runtime within which pquery tries to process QUERIES_PER_THREAD x THREADS queries against 1 mysqld
QUERIES_PER_THREAD=5000000                                     # Maximum number of queries executed per thread (THREADS) per trial (small = faster reduction, large = more crashes)
#MYINIT=""                                                      # Extra options to pass to mysqld AND at data directory init time, for example MYINIT="--early-plugin-load=keyring_file.so --keyring_file_data=keyring --innodb_sys_tablespace_encrypt=ON"
#MYEXTRA="--thread_handling=pool-of-threads --innodb_file_per_table=0"  # Extra options to pass to mysqld. Examples below
MYSAFE="--no-defaults --loose-innodb-buffer-pool-in-core-dump=0 --max_allowed_packet=33554432 --maximum-bulk_insert_buffer_size=1M --maximum-join_buffer_size=1M --maximum-max_heap_table_size=1M --maximum-max_join_size=1M --maximum-myisam_max_sort_file_size=1M --maximum-myisam_mmap_size=1M --maximum-myisam_sort_buffer_size=1M --maximum-optimizer_trace_max_mem_size=1M --maximum-preload_buffer_size=1M --maximum-query_alloc_block_size=1M --maximum-query_prealloc_size=1M --maximum-range_alloc_block_size=1M --maximum-read_buffer_size=1M --maximum-read_rnd_buffer_size=1M --maximum-sort_buffer_size=1M --maximum-tmp_table_size=1M --maximum-transaction_alloc_block_size=1M --maximum-transaction_prealloc_size=1M --log-output=none --secure-file-priv= --sql_mode=" 
                                                               # MYSAFE: See http://bugs.mysql.com/?id=73916 re: testing env setup. MYSAFE ensures cleaner/better QA runs
PRELOAD=0                                                      # Preload SQL as configured by PRELOAD_SQL
PRELOAD_SQL=                                                   # SQL file to preload (prepend) for all trials
#PRELOAD_SQL=${SCRIPT_PWD}/genericpreload.sql                  # SQL file to preload (prepend) for all trials
THREADS=7                                                      # Number of threads to use. Default: 1. Set to >1 to enable multi-threaded runs. Also see MULTI_THREADED_TESTC_LINES
MULTI_THREADED_TESTC_LINES=60000                               # Only takes effect if THREADS>1. pquery-run will take this amount of lines to form individual testcases for multi-threaded runs. IOW, if THREADS=1, pquery-run will just run one client, continuously getting random queries out of the per-trial SQL, until QUERIES_PER_THREAD queries is reached (if mysqld does not crash earlier). On the other hand, if THREADS>1, pquery-run will take a random chunk out of the per-trial SQL (to the amount of MULTI_THREADED_TESTC_LINES lines) _before_ starting each trial run. It will then run pquery, with THREADS threads, only using that smaller chunk extracted from the per-trial SQL. These individual SQL input files are saved in the trial's directory. You may want to keep this number small to ensure that true-multi-threaded testcase reduction using reducer.sh is still sufficiently fast (25K lines takes a few days to reduce), while keeping it large enough to ensure crashes/asserts to start with. To set this value, consider the sources in use and the runtime. With USE_ALL_DISK_SQL=1 the SQL is already a random sample of all SQL on the disk, usually around 100k lines (QUERIES_PER_ALL_DISK_RUN) collected every x (ALL_DISK_SQL_NEW_QUERIES_EVERY_X_TRIALS) trials (usually around 50), and each new trial will use out of these 100k already random lines the here defined number of lines, randomly. If the runtime is 20 seconds, then setting MULTI_THREADED_TESTC_LINES to 30k in this case is more than sufficient as trials (assuming for example 10 threads) usually execute in this time about 10-25k lines. With a single purpose-built SQL input file there is no such sampling, and as such it may make sense to set this number much larger, for example to 150k, though some consideration about the input file is needed too. The reason for using a smaller chunk of the per-trial SQL is that otherwise the storage would quickly run OOS as for multi-threaded runs the full per-trial SQL is saved, which serves as an excellent alternative testcase to use (with reducer and the multi* scripts as generated by startup in BASEDIR's) given the complexity of multi-threaded testcase reduction. For a large input file, say 1M lines, of which PQUERY_MAX_SQL_LINES is taken per trial, setting this MULTI_THREADED_TESTC_LINES setting to 30k should still work: each trial reads its own window of the input file, and out of the per-trial SQL 30k lines are randomly selected.
 
