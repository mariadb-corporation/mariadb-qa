# corlogic defaults. Search order: --config PATH, ./corlogic.conf, this file.
# CLI form works too: ./corlogic KEY=VALUE ... [basedir1 basedir2 ...]

# SIDES
BASEDIRS=                       # comma-separated basedirs; one alone = A/A (side2 same build)
ENGINE=innodb                   # forced engine when ENGINES is empty
ENGINES=                        # comma list -> one side per engine, on one basedir
ENGINE_MIX=0                    # 1 rotates engines per table (same map on every side)
FK=auto                         # auto|0|1
OPTIONS_SETS=                   # ';'-separated option groups -> one side per group
MYEXTRA=                        # server options, all sides
MYINIT=                         # extra options also used at datadir init
# BIN_SIDE<N>=                  # binary override for side N
# MYEXTRA_SIDE<N>=              # server options for side N only

# SQL STREAM
QUERIES_PER_TRIAL=1000          # 0 runs the seed schema and nothing else
TRIALS=0                        # 0 = infinite
SEED=0                          # 0 = entropy
PARTITIONING=1                  # 0|1|2 (2 adds MariaDB-only forms)
VIEWS=0                         # also turns the generator's ddl_view class on
SEQUENCES=0                     # MariaDB-only, also turns ddl_seq on; MySQL sides parse-skip
GENERATED_COLUMNS=0
TX=1                            # transactions, capability-guarded
SEED_SCHEMA=1                   # 0 runs no seed schema at all
SEED_SQL=                       # seed file instead of the built-in schema (needs SEED_SCHEMA=1)
SQL_FILTER_FILE=                # one case-insensitive ERE per line; matches are dropped

# COMPARE
ERROR_COMPARE=auto              # auto|state|code|text (auto: code same-vendor, state cross)
WARNING_COMPARE=auto            # auto|off|state|codes|text
WARNINGS_AS_BUG=0               # 1 turns warning-only deltas into bugs
FLOAT_DIGITS=10
ROWS_CAP=100000                 # rows past this are hashed + counted only; 0 keeps none
SKIP_PARSE_ERRORS=1             # 0 turns a 1064 on any side into a reportable diff
CHECKPOINT_EVERY=250            # in-stream ANALYZE + table-content compare every N statements
STATS_SAMPLE_PAGES=2000         # ANALYZE sample size, high enough that it counts
MAX_SPORADIC_ISSUE_REPEAT_ATTEMPTS=15   # fresh-instance replays a sporadic diff gets
QUERY_TIMEOUT=60                # seconds; one side over = TIMEOUT finding, all sides = skip

# PLAN + PERF
PLAN_COMPARE=1
PLAN_PERF_REPORT=auto           # auto|0|1; auto turns PLAN+PERF off on an OPTIONS_SETS run
PLAN_STATS_REFRESH=1            # ANALYZE both sides between the two plan reads; 0 = one pair
PLAN_FACTOR=3                   # rows-product ratio, same-basedir sides; 0 disables
PLAN_FACTOR_CROSS=10            # same, cross-version/vendor sides
PERF_FACTOR=4.0                 # slow/fast ratio; 0 disables
PERF_MIN_DELTA=250              # ms; both thresholds must trip

# REDUCTION + REPORTING
REDUCE_TIMEOUT=1800             # seconds per bug, then best-so-far
REDUCE_STEP_ATTEMPTS=3          # most replays one reduction step may spend
STRICT_REDUCE=0                 # 1 demands identical diff content while reducing
VERSION_SWEEP=1                 # replay each reduced bug across the gendirs.sh builds
VER_SWEEP_JOBS=7                # version sweeps replaying at once; a queued sweep holds nothing
KNOWN_FILE=                     # one path or a comma list; empty = corlogic.known plus the
                                # list the run picks, mysql for a cross-vendor run and
                                # engines for an engine matrix

# RUNTIME
WORKERS=0                       # workers in the pool, one server each; 0 = measured off the
                                # pre-flight against cpu, RAM and the run dir
WORKDIR_BASE=/data
RUNDIR_BASE=/dev/shm            # datadirs and templates; a disk path works when tmpfs is full
KEEP_ALL_TRIALS=0               # 1 keeps every trial's SQL
TUI=auto                        # auto|0|1
RAM_LIMIT_PCT=85                # a new server waits above this; 0 disables
GENERATOR_BIN=                  # default resolved at startup
WEIGHTS_FILE=                   # default ~/mariadb-qa/corlogic/corlogic.weights
CLIENT_PLUGIN_DIR=              # client auth plugins; default resolved at startup
CHARSET=utf8mb4
COLLATION=utf8mb4_general_ci
SQL_MODE=                       # replaces the default pack when set
SQL_MODE_ADD=
SQL_MODE_REMOVE=
PIN_MODE=fixed                  # fixed|global; plan settings at fixed values, or each side's own
# MEM_CAPS=                     # memory preset pack; the run log prints the one in use

# MODES
OPTIMIZER_SWITCH_COMBINATORICS=0   # 1: side2 runs one optimizer_switch combination per trial
OPTIMIZER_SWITCH_FLAGS=all-common  # all-common, or a comma list of flag names
